<div class="register-container">

  <h2>Créer un compte</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">

    <div class="row">
      <input type="text" placeholder="Nom" formControlName="nom">
      <input type="text" placeholder="Prénom" formControlName="prenom">
    </div>

    <input type="email" placeholder="Email" formControlName="email">

    <input type="password"
           placeholder="Mot de passe"
           formControlName="motDePasse">

    <small class="hint">
      Minimum 8 caractères, 1 majuscule, 1 minuscule et 1 chiffre
    </small>

    <input type="text" placeholder="Adresse" formControlName="adresse">
    <input type="text" placeholder="Téléphone" formControlName="telephone">

    <button type="submit" [disabled]="form.invalid">
      S'inscrire
    </button>

  </form>

  <p class="error" *ngIf="errorMsg">{{ errorMsg }}</p>
  <p class="success" *ngIf="successMsg">{{ successMsg }}</p>

  <p class="login-link">
    Déjà un compte ?
    <a routerLink="/login">Se connecter</a>
  </p>

</div>
